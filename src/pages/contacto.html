  <main>
    <section>
      <form action="https://formspree.io/f/mblojzkl" method="POST">
        <label for="name">Nombre:</label>
        <input type="text" id="name" name="name" placeholder="Dime quien eres" required>

        <label for="email">Correo electrónico:</label>
        <input type="email" id="email" name="email" placeholder="Donde te encuentro?" required>

        <label for="message">Mensaje:</label>
        <textarea id="message" name="message" rows="5" placeholder="Adelante, no tengas miedo" required></textarea>

        <button type="submit">Enviar</button>
      </form>
    </section>
  </main>
